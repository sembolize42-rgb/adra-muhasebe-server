<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adra Muhasebe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --paper:#F6F4EE;
    --paper-2:#EFEBE1;
    --line:#DAD4C4;
    --ink:#1E2A3A;
    --ink-soft:#6B7686;
    --blueprint:#2B5797;
    --blueprint-soft:#E7EEF7;
    --red:#AE4030;
    --red-soft:#F6E9E6;
    --green:#3E7A58;
    --green-soft:#E7F0EA;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh;}
  .app.hidden{display:none;}

  /* SIDEBAR */
  .sidebar{
    width:220px;
    flex-shrink:0;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    flex-direction:column;
    padding:24px 0;
  }
  .brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid rgba(246,244,238,0.15);
    margin-bottom:12px;
  }
  .brand-mark{
    font-size:11px;
    letter-spacing:0.18em;
    color:#9FB4D4;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .brand-title{
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px;flex:1;}
  .navbtn{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:var(--radius);
    background:transparent;
    border:none;
    color:#C7CFDA;
    font-size:13.5px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
  }
  .navbtn svg{flex-shrink:0;opacity:0.85;}
  .navbtn:hover{background:rgba(255,255,255,0.06);color:var(--paper);}
  .navbtn.active{background:var(--blueprint);color:#fff;}
  .navbtn.active svg{opacity:1;}
  .sidebar-foot{
    padding:14px 20px 0 20px;
    font-size:10.5px;
    color:#6B7686;
    border-top:1px solid rgba(246,244,238,0.1);
    margin-top:8px;
    letter-spacing:0.02em;
  }
  .sidebar-btn{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    color:#C7CFDA;
    padding:8px 10px;
    border-radius:var(--radius);
    font-size:11.5px;
    cursor:pointer;
    font-family:inherit;
    margin-top:6px;
  }
  .sidebar-btn:hover{background:rgba(255,255,255,0.14);color:#fff;}

  /* MAIN */
  main{flex:1;padding:32px 40px 60px 40px;max-width:1100px;}
  .sheet-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:26px;
  }
  .sheet-head h1{font-size:24px;margin:0 0 4px 0;letter-spacing:-0.01em;}
  .sheet-head .sub{font-size:13px;color:var(--ink-soft);}
  .titleblock{
    border:1px solid var(--ink);
    display:grid;
    grid-template-columns:auto auto;
    font-size:10.5px;
    min-width:220px;
  }
  .titleblock div{padding:5px 10px;border-top:1px solid var(--line);}
  .titleblock div:nth-child(1),.titleblock div:nth-child(2){border-top:none;}
  .titleblock .lbl{color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;border-right:1px solid var(--line);}
  .titleblock .val{font-weight:600;text-align:right;}

  /* CARDS / GRID */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:30px;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    padding:16px 18px;
    border-radius:var(--radius);
  }
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:8px;}
  .card .v{font-size:22px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
  .card.pos .v{color:var(--green);}
  .card.neg .v{color:var(--red);}
  .card.accent{border-color:var(--blueprint);background:var(--blueprint-soft);}

  section.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:22px;}
  section.panel h2{font-size:14px;margin:0 0 16px 0;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}

  /* FORM */
  form.row-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:20px;padding-bottom:20px;border-bottom:1px dashed var(--line);}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;}
  .field input,.field select{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 10px;
    font-size:13.5px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
    min-width:120px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--blueprint);outline-offset:1px;background:#fff;}
  .field.grow{flex:1;min-width:180px;}
  .field.grow input{width:100%;}
  .btn{
    background:var(--blueprint);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    height:36px;
  }
  .btn:hover{background:#224679;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink);}
  .btn.small{padding:5px 10px;font-size:11.5px;height:auto;}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    border-bottom:1px solid var(--ink);
    padding:8px 10px;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);}
  tbody tr:hover{background:var(--paper);}
  td.num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;}
  td.num.pos{color:var(--green);}
  td.num.neg{color:var(--red);}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;}
  .tag.bekliyor{background:#F5EDD8;color:#8A6D1D;}
  .tag.tahsil,.tag.odendi,.tag.kabul{background:var(--green-soft);color:var(--green);}
  .tag.karsiliksiz,.tag.red{background:var(--red-soft);color:var(--red);}
  .tag.beklemede{background:var(--blueprint-soft);color:var(--blueprint);}
  .del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 6px;}
  .del:hover{color:var(--red);}
  .editbtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px 6px;}
  .editbtn:hover{color:var(--blueprint);}
  tr.edit-row td{background:var(--blueprint-soft);padding:6px 8px;}
  tr.edit-row input,tr.edit-row select{width:100%;padding:5px 7px;font-size:12.5px;border:1px solid var(--line);border-radius:2px;background:#fff;font-family:inherit;}
  tr.note-row td{padding:4px 10px 12px 10px;border-bottom:1px solid var(--line);background:var(--paper);}
  .note-badge{font-size:11.5px;color:var(--green);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .note-add{font-size:11.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;}
  .note-add:hover{color:var(--blueprint);}
  .note-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .note-form .field input{padding:6px 8px;font-size:12.5px;border:1px solid var(--line);border-radius:2px;background:#fff;font-family:inherit;}
  .notebtn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:0 4px;}
  .notebtn:hover{color:var(--blueprint);}

  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13px;}
  .empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px;}

  select.status-select{border:1px solid var(--line);border-radius:var(--radius);padding:4px 6px;font-size:11.5px;font-family:inherit;background:#fff;}

  .proj-card{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .proj-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--paper);cursor:pointer;}
  .proj-head .name{font-weight:700;font-size:14px;}
  .proj-head .client{font-size:12px;color:var(--ink-soft);margin-left:8px;}
  .proj-bar-track{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;margin-top:6px;width:220px;}
  .proj-bar-fill{height:100%;background:var(--blueprint);}
  .proj-bar-fill.over{background:var(--red);}
  .proj-body{padding:14px 16px 18px 16px;border-top:1px solid var(--line);}

  ::placeholder{color:#A9AFBB;}

  /* Yatayda taşan tabloları kendi kutusu içinde kaydırılabilir yapar (mobilde
     sütunları sıkıştırmak yerine parmakla sağa/sola kaydırılır). */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* MOBIL TOP BAR — sadece küçük ekranlarda görünür, sidebar'ı açıp kapatan
     hamburger düğmesini içerir. */
  .mobile-topbar{display:none;}
  .sidebar-backdrop{display:none;}

  @media (max-width:860px){
    main{padding:20px 16px 40px 16px;max-width:100%;}
    .sheet-head{flex-direction:column;align-items:flex-start;gap:10px;}
    .titleblock{min-width:0;width:100%;}
    .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
    .card{padding:12px 14px;}
    .card .v{font-size:18px;}
    section.panel{padding:16px 14px;}
    form.row-form{gap:8px;}
    .field input,.field select{min-width:0;width:100%;font-size:16px;}
    .field{flex:1 1 140px;}
    .note-form .field input{font-size:16px;}

    .mobile-topbar{
      display:flex;
      align-items:center;
      gap:12px;
      position:sticky;
      top:0;
      z-index:30;
      background:var(--ink);
      color:var(--paper);
      padding:14px 16px;
    }
    .mobile-topbar .brand-title{font-size:16px;font-weight:700;}
    .hamburger{
      background:none;
      border:1px solid rgba(255,255,255,0.25);
      color:var(--paper);
      width:36px;height:36px;
      border-radius:var(--radius);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .app{display:block;}
    main{max-width:100%;}
    .sidebar{
      position:fixed;
      top:0; left:0; bottom:0;
      width:260px;
      z-index:50;
      transform:translateX(-100%);
      transition:transform 0.2s ease;
      overflow-y:auto;
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.open{
      display:block;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.4);
      z-index:40;
    }
  }

  /* LOGIN */
  .login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink);
  }
  .login-box{
    width:100%;
    max-width:320px;
    background:var(--paper);
    border-radius:var(--radius);
    padding:32px 28px;
  }
  .login-box .brand-mark{font-size:11px;letter-spacing:0.18em;color:var(--blueprint);text-transform:uppercase;margin-bottom:4px;}
  .login-box h1{font-size:20px;margin:0 0 22px 0;letter-spacing:-0.01em;}
  .login-box .field{margin-bottom:14px;}
  .login-box input{width:100%;}
  .login-box .btn{width:100%;}
  .login-error{color:var(--red);font-size:12.5px;margin:-4px 0 14px 0;min-height:1em;}
  .save-status{font-size:10px;color:#8FA6C9;margin-top:6px;min-height:1.4em;}
  .save-status.err{color:#E8A79A;}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm">
    <div class="brand-mark">Ölçek 1:1</div>
    <h1>Adra Muhasebe</h1>
    <div class="field">
      <label style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;display:block;margin-bottom:5px;">Ortak Şifre</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="btn" type="submit" id="loginSubmit">Giriş Yap</button>
  </form>
</div>

<div class="app hidden" id="appRoot">
  <div class="mobile-topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menüyü aç/kapat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand-title">Adra Muhasebe</div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">Ölçek 1:1</div>
      <div class="brand-title">Adra Muhasebe</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div style="margin-bottom:10px;">Mimarlık ofisleri için basit hesap takibi.</div>
      <button class="sidebar-btn" id="exportBtn">Yedeği İndir (.json)</button>
      <button class="sidebar-btn" id="importBtn">Yedek Yükle</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <div id="importMsg" style="font-size:10px;margin-top:6px;color:#8FA6C9;"></div>
      <button class="sidebar-btn" id="logoutBtn" style="margin-top:14px;">Çıkış Yap</button>
      <div class="save-status" id="saveStatus"></div>
    </div>
  </aside>
  <main>
    <div class="sheet-head">
      <div>
        <h1 id="pageTitle">Kasa</h1>
        <div class="sub" id="pageSub">Genel bakış</div>
      </div>
      <div class="titleblock" id="titleblock"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
const ICONS = {
  kasa: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M3 11h18"/><circle cx="12" cy="14.5" r="1.6"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  gelir: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>',
  gider: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14"/><path d="M18 13l-6 6-6-6"/></svg>',
  cekler: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M6 15h4"/><circle cx="16" cy="15" r="1.3"/></svg>',
  maaslar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>',
  cari: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 19.5z"/><path d="M8 3v18"/><path d="M12 8h5M12 12h5"/></svg>',
  projeler: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20V9l6-4 6 4v11"/><path d="M15 20v-7l6-3v10"/><path d="M9 20v-5h3v5"/></svg>',
  kredikarti: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5.5" width="19" height="13" rx="1.5"/><path d="M2.5 10h19"/><path d="M6 14.5h4"/></svg>',
  borclar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 8.5h6.5a2.5 2.5 0 0 1 0 5H8a2.5 2.5 0 0 0 0 5H15"/><path d="M11 3v3M11 18.5v2.5"/></svg>'
};

const TABS = [
  {id:'kasa', label:'Kasa', sub:'Genel bakış'},
  {id:'gelir', label:'Gelir', sub:'Gelen ödemeler'},
  {id:'gider', label:'Gider', sub:'Ofis ve proje giderleri'},
  {id:'cekler', label:'Çekler', sub:'Alınan ve verilen çekler'},
  {id:'maaslar', label:'Maaşlar', sub:'Ortakların çektiği tutarlar'},
  {id:'cari', label:'Cari Hesap', sub:'Müşteri ve tedarikçi borç / alacak takibi'},
  {id:'projeler', label:'Proje Maliyetleri', sub:'Projelere göre maliyet takibi'},
  {id:'kredikarti', label:'Kredi Kartı', sub:'Harcamalar ve ödemeler'},
  {id:'borclar', label:'Borçlar', sub:'Döviz / TL borç ve geri ödeme takibi'}
];

let state = {transactions:[], checks:[], projects:[], costs:[], cards:[], cardCharges:[], partners:[], salaryPayments:[], customers:[], customerEntries:[], transfers:[], bankAccounts:[{id:'banka', name:'Banka-1', archived:false}], loans:[], loanPayments:[]};
let current = 'kasa';
let loaded = false;
let expandedProject = null;
let expandedCard = null;
let expandedPartner = null;
let expandedCustomer = null;
let editingTxId = null;
let editingCariId = null;
let editingChargeId = null;
let recordingMaasId = null;
let editingMaasId = null;
let editingTransferId = null;
let editingBankId = null;
let editingCekId = null;
let expandedLoan = null;
let editingLoanId = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '-'; const [y,m,day]=d.split('-'); return day+'.'+m+'.'+y; }

const DEFAULT_STATE = {transactions:[], checks:[], projects:[], costs:[], cards:[], cardCharges:[], partners:[], salaryPayments:[], customers:[], customerEntries:[], transfers:[], bankAccounts:[{id:'banka', name:'Banka-1', archived:false}], loans:[], loanPayments:[]};

// Veri artık tarayıcıda değil, paylaşımlı bir PostgreSQL veritabanında
// (Express API üzerinden) tutuluyor. stateVersion, iyimser eşzamanlılık
// kontrolü için — GET ile alınan version, PUT'ta geri gönderilir; başka biri
// bu arada kaydettiyse sunucu 409 döner ve en güncel veriyi yeniden çekeriz.
let stateVersion = 0;

function setSaveStatus(text, isError){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('err', !!isError);
}

async function apiFetch(url, options){
  const res = await fetch(url, Object.assign({credentials:'same-origin'}, options));
  if(res.status===401){
    showLoginScreen('Oturum sona erdi, tekrar giriş yap.');
    throw new Error('unauthorized');
  }
  return res;
}

async function loadData(){
  const res = await apiFetch('/api/state');
  if(!res.ok){ throw new Error('Veri yüklenemedi (HTTP '+res.status+')'); }
  const body = await res.json();
  state = Object.assign({}, DEFAULT_STATE, body.state);
  stateVersion = body.version;
  loaded = true;
}

async function saveData(){
  setSaveStatus('Kaydediliyor…');
  try{
    const res = await apiFetch('/api/state', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state, baseVersion: stateVersion})
    });
    if(res.status===409){
      const body = await res.json().catch(()=>({}));
      setSaveStatus('Çakışma: başka biri güncelledi, veriler yenileniyor…', true);
      alert('Bu kaydı başka biri güncelledi. Sayfa en güncel veriyle yenilenecek, az önceki değişikliğini kontrol edip tekrar girmen gerekebilir.');
      await loadData();
      render();
      return;
    }
    if(!res.ok){ throw new Error('Kayıt başarısız (HTTP '+res.status+')'); }
    const body = await res.json();
    stateVersion = body.version;
    setSaveStatus('Kaydedildi ✓');
  }catch(e){
    if(e.message==='unauthorized') return;
    console.error('Kayıt hatası', e);
    setSaveStatus('Kaydedilemedi — bağlantını kontrol et.', true);
  }
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'navbtn' + (current===t.id ? ' active':'');
    b.innerHTML = ICONS[t.id] + '<span>'+t.label+'</span>';

function accOpts(selected){
  const sel = selected || 'nakit';
  let html = `<option value="nakit" ${sel==='nakit'?'selected':''}>Nakit</option>`;
  state.bankAccounts.forEach(b=>{
    if(b.archived && b.id!==sel) return;
    const suffix = b.archived ? ' (arşivlenmiş)' : '';
    html += `<option value="${b.id}" ${sel===b.id?'selected':''}>${esc(b.name)}${suffix}</option>`;
  });
  return html;
}
function accLabel(a){
  if(!a || a==='nakit') return 'Nakit';
  const bank = state.bankAccounts.find(b=>b.id===a);
  return bank ? bank.name : 'Banka';
}

function curSymbol(cur){ return cur==='USD' ? '$' : cur==='EUR' ? '€' : '₺'; }
function loanBalance(loan){
  const paid = state.loanPayments.filter(p=>p.loanId===loan.id).reduce((s,p)=>s+Number(p.amountFx),0);
  return Number(loan.amount) - paid;
}

function accountBalance(acc){
  const gelir = state.transactions.filter(t=>t.type==='gelir' && (t.account||'nakit')===acc).reduce((s,t)=>s+Number(t.amount),0);
  const gider = state.transactions.filter(t=>t.type==='gider' && (t.account||'nakit')===acc).reduce((s,t)=>s+Number(t.amount),0);
  const transferIn = state.transfers.filter(x=>x.to===acc).reduce((s,x)=>s+Number(x.amount),0);
  const transferOut = state.transfers.filter(x=>x.from===acc).reduce((s,x)=>s+Number(x.amount),0);
  return gelir - gider + transferIn - transferOut;
}

function totals(){
  const gelir = state.transactions.filter(t=>t.type==='gelir').reduce((s,t)=>s+Number(t.amount),0);
  const gider = state.transactions.filter(t=>t.type==='gider').reduce((s,t)=>s+Number(t.amount),0);
  const kasa = gelir - gider;
  const bekleyenCek = state.checks.filter(c=>c.status==='bekliyor').reduce((s,c)=>s+Number(c.amount),0);
  const kkBorc = state.cardCharges.filter(c=>c.status==='odenmedi').reduce((s,c)=>s+Number(c.amount),0);
  const ortakCekisi = state.salaryPayments.reduce((s,p)=>s+Number(p.amount),0);
  const musteriAlacak = state.customers.filter(cu=>(cu.type||'musteri')!=='tedarikci').reduce((sum,cu)=>{
    return sum + customerBalance(cu.id);
  },0);
  const tedarikciBorcu = state.customers.filter(cu=>cu.type==='tedarikci').reduce((sum,cu)=>{
    return sum + customerBalance(cu.id);
  },0);
  const nakitBakiye = accountBalance('nakit');
  const bankBalances = state.bankAccounts.filter(b=>!b.archived).map(b=>({id:b.id, name:b.name, bakiye:accountBalance(b.id)}));
  const bankaToplam = bankBalances.reduce((s,b)=>s+b.bakiye,0);
  const loanBalances = {TRY:0, USD:0, EUR:0};
  state.loans.forEach(l=>{ loanBalances[l.currency] = (loanBalances[l.currency]||0) + loanBalance(l); });
  return {gelir, gider, kasa, bekleyenCek, kkBorc, ortakCekisi, musteriAlacak, tedarikciBorcu, nakitBakiye, bankBalances, bankaToplam, loanBalances};
}

/* ---------- GELİR / GİDER ---------- */
function customerBalance(id){
  const entries = state.customerEntries.filter(e=>e.customerId===id);
  const borc = entries.filter(e=>e.type==='borc').reduce((s,e)=>s+Number(e.amount),0);
  const settlement = entries.filter(e=>e.type==='tahsilat'||e.type==='odeme').reduce((s,e)=>s+Number(e.amount),0);
  return borc - settlement;
}

function syncCustomerEntryForTx(tx){
  let entry = state.customerEntries.find(e=>e.txId===tx.id);
  const linkable = (tx.type==='gelir' || tx.type==='gider') && tx.customerId;
  if(linkable){
    const settleType = tx.type==='gelir' ? 'tahsilat' : 'odeme';
    if(entry){
      entry.customerId = tx.customerId;
      entry.date = tx.date;
      entry.description = tx.description;
      entry.amount = tx.amount;
      entry.type = settleType;
    } else {
      state.customerEntries.push({id:uid(), customerId:tx.customerId, date:tx.date, description:tx.description, type:settleType, amount:tx.amount, txId:tx.id});
    }
  } else if(entry){
    state.customerEntries = state.customerEntries.filter(e=>e.id!==entry.id);
  }
}

function saveTxEdit(txId, vals){
  const tx = state.transactions.find(t=>t.id===txId);
  if(!tx) return;
  tx.date = vals.date;
  tx.description = vals.description;
  tx.category = vals.category;
  tx.project = vals.project;
  tx.amount = vals.amount;
  tx.account = vals.account || 'nakit';
  if(tx.type==='gelir' || tx.type==='gider'){
    tx.customerId = vals.customerId || null;
    syncCustomerEntryForTx(tx);
  }
}

function saveCariEdit(entryId, vals){
  const entry = state.customerEntries.find(e=>e.id===entryId);
  if(!entry) return;
  const customer = state.customers.find(c=>c.id===entry.customerId);
  const isTedarikci = cariType(customer)==='tedarikci';
  const txType = isTedarikci ? 'gider' : 'gelir';
  const desc = isTedarikci ? 'Tedarikçi ödemesi' : 'Müşteri tahsilatı';
  const category = isTedarikci ? 'Tedarikçi Ödemesi' : 'Müşteri Tahsilatı';
  const wasSettlement = entry.type==='tahsilat' || entry.type==='odeme';
  const nowSettlement = vals.type==='tahsilat' || vals.type==='odeme';
  if(wasSettlement && entry.txId){
    if(nowSettlement){
      const tx = state.transactions.find(t=>t.id===entry.txId);
      if(tx){ tx.date=vals.date; tx.description=vals.description; tx.amount=vals.amount; }
    } else {
      state.transactions = state.transactions.filter(t=>t.id!==entry.txId);
      entry.txId = null;
    }
  } else if(!wasSettlement && nowSettlement){
    const txId = uid();
    state.transactions.push({id:txId, type:txType, date:vals.date, description:desc+(customer?' - '+customer.name:'')+(vals.description?' ('+vals.description+')':''), category, project:'', amount:vals.amount, customerId:entry.customerId, account:vals.account||'nakit'});
    entry.txId = txId;
  }
  entry.date = vals.date;
  entry.description = vals.description;
  entry.type = vals.type;
  entry.amount = vals.amount;
}

  charge.date = vals.date;

  charge.amount = vals.amount;

      tx.amount = vals.amount;
      tx.description = 'Kredi kartı ödemesi: '+(vals.description||'')+(card?' ('+card.name+')':'');
    }
  }
}

/* ---------- ÇEKLER ---------- */
function checkStatusOptions(direction, current){
  const opts = [{v:'bekliyor', l:'Bekliyor'}];
  if(direction==='alinan') opts.push({v:'tahsil', l:'Tahsil Edildi'});
  else opts.push({v:'odendi', l:'Ödendi'});
  opts.push({v:'karsiliksiz', l:'Karşılıksız'});
  return opts.map(o=>`<option value="${o.v}" ${current===o.v?'selected':''}>${o.l}</option>`).join('');
}
function checkIsCompleted(check){
  return (check.direction==='alinan' && check.status==='tahsil') || (check.direction==='verilen' && check.status==='odendi');
}
function syncCheckTransaction(check){
  const shouldHaveTx = checkIsCompleted(check);
  if(shouldHaveTx){
    const desc = 'Çek '+(check.direction==='alinan'?'tahsilatı':'ödemesi')+': '+(check.description||'')+(check.bank?' ('+check.bank+')':'');
    if(check.txId){
      const tx = state.transactions.find(t=>t.id===check.txId);
      if(tx){ tx.date = check.dueDate; tx.amount = Number(check.amount); tx.account = check.account||'nakit'; tx.description = desc; }
    } else {
      const txId = uid();
      state.transactions.push({id:txId, type: check.direction==='alinan'?'gelir':'gider', date: check.dueDate, description: desc, category: 'Çek '+(check.direction==='alinan'?'Tahsilatı':'Ödemesi'), project:'', amount: Number(check.amount), account: check.account||'nakit'});
      check.txId = txId;
    }
  } else if(check.txId){
    state.transactions = state.transactions.filter(t=>t.id!==check.txId);
    check.txId = null;
  }
}

const XLS_COLOR = {
  ink:'FF1E2A3A', blueprint:'FF2B5797', blueprintSoft:'FFE7EEF7',
  paper:'FFF6F4EE', line:'FFDAD4C4', white:'FFFFFFFF',
  green:'FF3E7A58', greenSoft:'FFE7F0EA', red:'FFAE4030', redSoft:'FFF6E9E6'
};

function styleHeaderRow(row){
  row.eachCell(cell=>{
    cell.font = {bold:true, color:{argb:XLS_COLOR.white}, size:11, name:'Calibri'};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLS_COLOR.blueprint}};
    cell.alignment = {vertical:'middle', horizontal:'left'};
    cell.border = {bottom:{style:'thin', color:{argb:XLS_COLOR.blueprint}}};
  });
  row.height = 22;
}

function styleDataRow(row, striped){
  row.eachCell(cell=>{
    cell.font = {color:{argb:XLS_COLOR.ink}, size:10.5, name:'Calibri'};
    cell.border = {bottom:{style:'hair', color:{argb:XLS_COLOR.line}}};
    if(striped) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:XLS_COLOR.paper}};
  });
  row.height = 18;
}

function styleTotalRow(row, accentSoft, accentColor){
  row.eachCell(cell=>{
    cell.font = {bold:true, color:{argb:accentColor||XLS_COLOR.ink}, size:10.5, name:'Calibri'};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:accentSoft||XLS_COLOR.blueprintSoft}};
    cell.border = {top:{style:'thin', color:{argb:XLS_COLOR.blueprint}}};
  });
  row.height = 20;
}

function addLedgerSheet(wb, name, columns, rows, totalLabel, totalValue, amountColIdx, accentSoft, accentColor, extraMoneyCols, emptyMsg, labelColIdx, noTotal){
  const ws = wb.addWorksheet(name, {views:[{state:'frozen', ySplit:1}], properties:{tabColor:{argb:accentColor||XLS_COLOR.blueprint}}});
  ws.columns = columns.map(c=>({header:c.header, key:c.key, width:c.width}));
  styleHeaderRow(ws.getRow(1));
  rows.forEach((r,i)=>{
    const row = ws.addRow(r);
    styleDataRow(row, i%2===1);
    if(amountColIdx!==undefined){
      row.getCell(amountColIdx).numFmt = '#,##0.00" ₺"';
      row.getCell(amountColIdx).alignment = {horizontal:'right'};
    }
    if(extraMoneyCols){
      extraMoneyCols.forEach(idx=>{ row.getCell(idx).numFmt = '#,##0.00" ₺"'; row.getCell(idx).alignment = {horizontal:'right'}; });
    }
  });
  if(rows.length && !noTotal){
    const totalObj = {}; columns.forEach(c=>totalObj[c.key]='');
    totalObj[columns[(labelColIdx!==undefined?labelColIdx:1)].key] = totalLabel;
    if(amountColIdx!==undefined) totalObj[columns[amountColIdx-1].key] = totalValue;
    const tRow = ws.addRow(totalObj);
    styleTotalRow(tRow, accentSoft, accentColor);
    if(amountColIdx!==undefined){
      tRow.getCell(amountColIdx).numFmt = '#,##0.00" ₺"';
      tRow.getCell(amountColIdx).alignment = {horizontal:'right'};
    }
  } else if(!rows.length){
    const emptyRow = ws.addRow({});
    ws.mergeCells(2,1,2,columns.length);
    emptyRow.getCell(1).value = emptyMsg || 'Bu tarih aralığında kayıt bulunamadı.';
    emptyRow.getCell(1).font = {italic:true, color:{argb:'FF9AA3AF'}};
  }
  ws.autoFilter = {from:{row:1, column:1}, to:{row:ws.rowCount, column:columns.length}};
  return ws;
}

  const checkList = state.checks.filter(c=>inRange(c.dueDate)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));

  const cekToplam = checkRows.reduce((s,r)=>s+r.tutar,0);

  const cariList = state.customerEntries.filter(e=>inRange(e.date)).sort((a,b)=>a.date.localeCompare(b.date));

  addLedgerSheet(wb, 'Proje Maliyetleri',

  const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

function emptyState(title, sub){
  return `<div class="empty"><b>${title}</b>${sub}</div>`;
}
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function attachHandlers(){
  const exportBtn = document.getElementById('exportExcelBtn');
  if(exportBtn){
    exportBtn.onclick = async ()=>{
      const s = document.getElementById('exportStart').value;
      const e = document.getElementById('exportEnd').value;
      exportBtn.disabled = true;
      const originalText = exportBtn.textContent;
      exportBtn.textContent = 'Hazırlanıyor…';
      try{
        await exportExcel(s||null, e||null);
      } catch(err){
        console.error(err);
        alert('Excel dosyası oluşturulurken bir sorun oluştu.');
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = originalText;
      }
    };
  }
  document.querySelectorAll('[data-form]').forEach(f=>{
    f.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(f);
      const kind = f.dataset.form;
      if(kind==='tx-gelir' || kind==='tx-gider'){
        const txId = uid();
        const customerId = kind==='tx-gelir' ? (fd.get('customerId')||null) : null;
        state.transactions.push({id:txId, type: kind==='tx-gelir'?'gelir':'gider', date:fd.get('date'), description:fd.get('description'), category:fd.get('category'), project:fd.get('project'), amount:Number(fd.get('amount')), customerId, account: fd.get('account')||'nakit'});
        if(customerId){
          state.customerEntries.push({id:uid(), customerId, date:fd.get('date'), description:fd.get('description'), type:'tahsilat', amount:Number(fd.get('amount')), txId});
        }
      } else if(kind==='banka'){
        state.bankAccounts.push({id:uid(), name:fd.get('name'), archived:false});
      } else if(kind==='transfer'){
        const from = fd.get('from'); const to = fd.get('to');
        if(from===to){ alert('Kaynak ve hedef hesap aynı olamaz.'); }
        else { state.transfers.push({id:uid(), date:fd.get('date'), from, to, description:fd.get('description'), amount:Number(fd.get('amount'))}); }
      } else if(kind==='cek'){
        state.checks.push({id:uid(), direction:fd.get('direction'), bank:fd.get('bank'), checkNo:fd.get('checkNo'), description:fd.get('description'), receivedDate:fd.get('receivedDate'), dueDate:fd.get('dueDate'), account:fd.get('account')||'nakit', amount:Number(fd.get('amount')), status:'bekliyor', txId:null});
      } else if(kind==='proje'){
        state.projects.push({id:uid(), name:fd.get('name'), client:fd.get('client'), budget:Number(fd.get('budget'))||0});
      } else if(kind==='cost'){
        state.costs.push({id:uid(), projectId:f.dataset.projectId, date:fd.get('date'), description:fd.get('description'), category:fd.get('category'), amount:Number(fd.get('amount'))});
      } else if(kind==='kart'){
        state.cards.push({id:uid(), name:fd.get('name')});
      } else if(kind==='sarj'){
        state.cardCharges.push({id:uid(), cardId:f.dataset.cardId, date:fd.get('date'), description:fd.get('description'), amount:Number(fd.get('amount')), status:'odenmedi', paymentTxId:null, paymentDate:null});
      } else if(kind==='odeme'){
        const card = state.cards.find(k=>k.id===f.dataset.cardId);
        const desc = fd.get('description');
        state.transactions.push({id:uid(), type:'gider', date:fd.get('date'), description:'Kredi kartı ödemesi'+(card?' ('+card.name+')':'')+(desc?' - '+desc:''), category:'Kredi Kartı Ödemesi', project:'', amount:Number(fd.get('amount'))});
      } else if(kind==='borc'){
        state.loans.push({id:uid(), name:fd.get('name'), currency:fd.get('currency')||'TRY', amount:Number(fd.get('amount')), date:fd.get('date'), description:fd.get('description')});
      } else if(kind==='borcodeme'){
        const loan = state.loans.find(l=>l.id===f.dataset.loanId);
        const amountFx = Number(fd.get('amountFx'))||0;
        const rate = (loan && loan.currency==='TRY') ? 1 : (Number(fd.get('rate'))||0);
        const amountTRY = (loan && loan.currency==='TRY') ? amountFx : amountFx*rate;
        const desc = fd.get('description');
        const txId = uid();
        state.transactions.push({id:txId, type:'gider', date:fd.get('date'), description:'Borç ödemesi'+(loan?' - '+loan.name:'')+(desc?' ('+desc+')':''), category:'Borç Ödemesi', project:'', amount:amountTRY, account:fd.get('account')||'nakit'});
        state.loanPayments.push({id:uid(), loanId:f.dataset.loanId, date:fd.get('date'), amountFx, rate, amountTRY, account:fd.get('account')||'nakit', description:desc, txId});
      } else if(kind==='ortak'){
        state.partners.push({id:uid(), name:fd.get('name')});
      } else if(kind==='maas'){
        const partner = state.partners.find(x=>x.id===f.dataset.partnerId);
        const txId = uid();
        const desc = fd.get('description');
        const acc = fd.get('account')||'nakit';
        state.transactions.push({id:txId, type:'gider', date:fd.get('date'), description:'Ortak çekişi'+(partner?' - '+partner.name:'')+(desc?' ('+desc+')':''), category:'Ortak Maaşı/Çekişi', project:'', amount:Number(fd.get('amount')), account:acc});
        state.salaryPayments.push({id:uid(), partnerId:f.dataset.partnerId, date:fd.get('date'), description:desc, amount:Number(fd.get('amount')), txId, account:acc, recorded:false, recordedDate:null, recordedNote:null});
      } else if(kind==='musteri'){
        state.customers.push({id:uid(), name:fd.get('name'), type: fd.get('type')||'musteri'});
      } else if(kind==='cari'){
        const type = fd.get('type');
        const customer = state.customers.find(x=>x.id===f.dataset.customerId);
        const isTedarikci = cariType(customer)==='tedarikci';
        const desc = fd.get('description');
        let txId = null;
        if(type==='tahsilat' || type==='odeme'){
          txId = uid();
          const txType = isTedarikci ? 'gider' : 'gelir';
          const label = isTedarikci ? 'Tedarikçi ödemesi' : 'Müşteri tahsilatı';
          const category = isTedarikci ? 'Tedarikçi Ödemesi' : 'Müşteri Tahsilatı';
          state.transactions.push({id:txId, type:txType, date:fd.get('date'), description:label+(customer?' - '+customer.name:'')+(desc?' ('+desc+')':''), category, project:'', amount:Number(fd.get('amount')), customerId:f.dataset.customerId, account:fd.get('account')||'nakit'});
        }
        state.customerEntries.push({id:uid(), customerId:f.dataset.customerId, date:fd.get('date'), description:desc, type, amount:Number(fd.get('amount')), txId});
      }
      await saveData();
      render();
    });
  });

  document.querySelectorAll('[data-edit-bank]').forEach(b=>b.onclick=()=>{ editingBankId = b.dataset.editBank; render(); });
  document.querySelectorAll('[data-cancel-bank]').forEach(b=>b.onclick=()=>{ editingBankId = null; render(); });
  document.querySelectorAll('[data-save-bank]').forEach(b=>b.onclick=async()=>{
    const id = b.dataset.saveBank;
    const row = b.closest('tr');
    const name = row.querySelector('.eb-name').value.trim();
    if(!name){ alert('Hesap adı boş olamaz.'); return; }
    const bank = state.bankAccounts.find(x=>x.id===id);
    if(bank) bank.name = name;
    editingBankId = null;
    await saveData(); render();
  });
  document.querySelectorAll('[data-del-bank]').forEach(b=>b.onclick=async()=>{
    const id = b.dataset.delBank;
    const bal = accountBalance(id);
    if(Math.abs(bal) > 0.005){
      alert('Bu hesabın bakiyesi sıfır değil ('+fmt(bal)+' ₺). Silebilmek için önce Hesaplar Arası Transfer ile bakiyeyi sıfırlaman gerekiyor.');
      return;
    }
    if(!confirm('Bu banka hesabını silmek istediğine emin misin? Geçmiş kayıtlar korunur ve raporlarda görünmeye devam eder, sadece yeni işlemlerde seçilemez hale gelir.')) return;
    const bank = state.bankAccounts.find(x=>x.id===id);
    if(bank) bank.archived = true;
    await saveData(); render();
  });
  document.querySelectorAll('[data-restore-bank]').forEach(b=>b.onclick=async()=>{
    const bank = state.bankAccounts.find(x=>x.id===b.dataset.restoreBank);
    if(bank) bank.archived = false;
    await saveData(); render();
  });
  document.querySelectorAll('[data-del-transfer]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Bu transfer kaydını silmek istediğine emin misin?')) return;
    state.transfers = state.transfers.filter(x=>x.id!==b.dataset.delTransfer);
    await saveData(); render();
  });
  document.querySelectorAll('[data-edit-transfer]').forEach(b=>b.onclick=()=>{ editingTransferId = b.dataset.editTransfer; render(); });
  document.querySelectorAll('[data-cancel-transfer]').forEach(b=>b.onclick=()=>{ editingTransferId = null; render(); });
  document.querySelectorAll('[data-save-transfer]').forEach(b=>b.onclick=async()=>{
    const id = b.dataset.saveTransfer;
    const row = b.closest('tr');
    const from = row.querySelector('.et-from').value;
    const to = row.querySelector('.et-to').value;
    if(from===to){ alert('Kaynak ve hedef hesap aynı olamaz.'); return; }
    const item = state.transfers.find(x=>x.id===id);
    if(item){
      item.date = row.querySelector('.et-date').value;
      item.from = from;
      item.to = to;
      item.description = row.querySelector('.et-desc').value;
      item.amount = Number(row.querySelector('.et-amount').value)||0;
    }
    editingTransferId = null;
    await saveData(); render();
  });
  document.querySelectorAll('[data-del-tx]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Bu kaydı silmek istediğine emin misin?')) return;
    const id = b.dataset.delTx;
    state.transactions = state.transactions.filter(x=>x.id!==id);
    state.customerEntries = state.customerEntries.filter(e=>e.txId!==id);
    await saveData(); render();
  });
  document.querySelectorAll('[data-edit-tx]').forEach(b=>b.onclick=()=>{ editingTxId = b.dataset.editTx; render(); });
  document.querySelectorAll('[data-cancel-tx]').forEach(b=>b.onclick=()=>{ editingTxId = null; render(); });
  document.querySelectorAll('[data-save-tx]').forEach(b=>b.onclick=async()=>{
    const id = b.dataset.saveTx;
    const row = b.closest('tr');
    const vals = {
      date: row.querySelector('.ei-date').value,
      description: row.querySelector('.ei-desc').value,
      category: row.querySelector('.ei-cat').value,
      project: row.querySelector('.ei-proj').value,
      account: row.querySelector('.ei-account') ? row.querySelector('.ei-account').value : 'nakit',
      amount: Number(row.querySelector('.ei-amount').value)||0
    };
    const custSel = row.querySelector('.ei-customer');
    if(custSel) vals.customerId = custSel.value || null;
    saveTxEdit(id, vals);
    editingTxId = null;
    await saveData(); render();
  });
  document.querySelectorAll('[data-del-cek]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Bu çek kaydını silmek istediğine emin misin?')) return;
    const id = b.dataset.delCek;
    const item = state.checks.find(x=>x.id===id);
    if(item && item.txId){ state.transactions = state.transactions.filter(t=>t.id!==item.txId); }
    state.checks = state.checks.filter(x=>x.id!==id);
    await saveData(); render();
  });
  document.querySelectorAll('[data-edit-cek]').forEach(b=>b.onclick=()=>{ editingCekId = b.dataset.editCek; render(); });
  document.querySelectorAll('[data-cancel-cek]').forEach(b=>b.onclick=()=>{ editingCekId = null; render(); });
  document.querySelectorAll('[data-save-cek]').forEach(b=>b.onclick=async()=>{
    const id = b.dataset.saveCek;

      item.receivedDate = row.querySelector('.eck2-received').value;
      item.dueDate = row.querySelector('.eck2-due').value;
      item.bank = row.querySelector('.eck2-bank').value;
      item.description = row.querySelector('.eck2-desc').value;
      item.account = row.querySelector('.eck2-account').value;
      item.amount = Number(row.querySelector('.eck2-amount').value)||0;
      syncCheckTransaction(item);
    }
    editingCekId = null;
    await saveData(); render();
  });
  document.querySelectorAll('[data-status-cek]').forEach(s=>s.onchange=async()=>{

  document.querySelectorAll('[data-del-proj]').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation(); if(!confirm('Bu projeyi ve tüm maliyet kayıtlarını silmek istediğine emin misin?')) return; const id=b.dataset.delProj; state.projects = state.projects.filter(x=>x.id!==id); state.costs = state.costs.filter(x=>x.projectId!==id); await saveData(); render(); });

  document.querySelectorAll('[data-toggle-customer]').forEach(el=>el.onclick=(e)=>{

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'adra-muhasebe-yedek-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setImportMsg(text, isError){
  const el = document.getElementById('importMsg');
  el.textContent = text;
  el.style.color = isError ? '#E8A79A' : '#8FA6C9';
  if(text) setTimeout(()=>{ if(el.textContent===text) el.textContent=''; }, 4000);
}

function setupBackupControls(){
  document.getElementById('exportBtn').onclick = exportData;
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!confirm('Mevcut kayıtların yerine bu yedek dosyası yüklenecek. Devam edilsin mi?')){ e.target.value=''; return; }
      state = Object.assign({}, DEFAULT_STATE, parsed);
      await saveData();
      render();
      setImportMsg('Yedek başarıyla yüklendi.', false);
    }catch(err){
      setImportMsg('Dosya okunamadı, geçerli bir yedek olduğundan emin ol.', true);
    }
    e.target.value = '';
  };
}

function showLoginScreen(errorMsg){
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginError').textContent = errorMsg || '';
  const pwInput = document.getElementById('loginPassword');
  pwInput.value = '';
  pwInput.focus();
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').classList.remove('hidden');
}

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('hamburgerBtn').addEventListener('click', ()=>{
  const isOpen = document.getElementById('sidebar').classList.contains('open');
  if(isOpen) closeSidebar(); else openSidebar();
});
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

// Render gibi ücretsiz hosting'lerde hareketsiz kalan instance uykuya dalar;
// uyanırken ilk istek(ler) kısa süreliğine hata dönebilir. Sert bir hata
// göstermeden önce birkaç kez sessizce tekrar deneyip gerçek bir kesintiyle
// (uzun süren cold start) geçici bir aksaklığı birbirinden ayırıyoruz.
async function fetchJsonWithRetry(url, options, attempts, delayMs){
  let lastErr;
  for(let i=0; i<attempts; i++){
    try{
      const res = await fetch(url, options);
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }catch(e){
      lastErr = e;
      if(i < attempts-1) await sleep(delayMs);
    }
  }
  throw lastErr;
}

async function boot(){
  document.getElementById('content').innerHTML = '<div class="empty">Yükleniyor…</div>';
  setupBackupControls();
  try{
    // İlk birkaç deneme hızlı art arda (kısa ağ takılmaları için), sonrakiler
    // yavaşlayarak devam eder (sunucu uykudan uyanıyor olabilir, ~50sn sürebilir).
    const body = await fetchJsonWithRetry('/api/session', {credentials:'same-origin'}, 10, 3000);
    if(body.authenticated){
      showApp();
      await loadData();
      render();
    } else {
      showLoginScreen();
    }
  }catch(e){
    console.error(e);
    showLoginScreen('Sunucuya bağlanılamadı. Sayfayı yenilemeyi dene.');
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const submitBtn = document.getElementById('loginSubmit');
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Kontrol ediliyor…';
  const loginOptions = {
    method:'POST',
    credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: document.getElementById('loginPassword').value})
  };
  try{
    let res, ok=false, isJson=false;
    // Sunucu henüz uyanıyor olabilir (bkz. boot()) — bir kaç kez sessizce dene.
    for(let i=0; i<3; i++){
      res = await fetch('/api/login', loginOptions);
      isJson = (res.headers.get('content-type')||'').includes('application/json');
      if(res.ok || isJson){ ok = res.ok; break; } // gerçek bir cevap (başarı ya da "şifre yanlış") aldık
      if(i<2) await sleep(2000);
    }
    const body = isJson ? await res.json().catch(()=>({})) : {};
    if(ok){
      showApp();
      document.getElementById('content').innerHTML = '<div class="empty">Yükleniyor…</div>';
      await loadData();
      render();
    } else {
      errEl.textContent = body.error || 'Sunucuya bağlanılamadı, tekrar dener misin?';
    }
  }catch(e){
    errEl.textContent = 'Sunucuya bağlanılamadı.';
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Giriş Yap';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await fetch('/api/logout', {method:'POST', credentials:'same-origin'});
  showLoginScreen();
});

boot();
</script>
